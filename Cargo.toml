[package]
name = "rambler"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rambler"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop", "qwen-blas"]
desktop = ["dep:arboard", "dep:dioxus", "dep:dioxus-free-icons", "dep:tokio"]
qwen-blas = ["qwen-asr/blas"]

[dependencies]
anyhow = "1"
arboard = { version = "3.6", optional = true }
candle = { package = "candle-core", version = "0.11" }
candle-transformers = "0.11"
cpal = "0.18"
dioxus = { version = "0.7", default-features = false, features = ["desktop", "launch", "lib"], optional = true }
dioxus-free-icons = { version = "0.10", default-features = false, features = ["material-design-icons-action", "material-design-icons-av", "material-design-icons-content", "material-design-icons-hardware", "material-design-icons-image", "material-design-icons-navigation"], optional = true }
tokenizers = "0.23"
tokio = { version = "1", features = ["rt", "time"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Keep upstream features explicit; `qwen-blas` enables its optimized CPU path.
qwen-asr = { version = "0.11", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"

[profile.dev]
incremental = false

[profile.release]
incremental = false
codegen-units = 1
lto = "thin"

[package]
name = "rambler"
version = "0.1.0"
edition = "2024"

[features]
default = ["desktop"]
desktop = ["dep:arboard", "dep:dioxus", "dep:tokio"]

[dependencies]
anyhow = "1"
arboard = { version = "3.6", optional = true }
candle = { package = "candle-core", version = "0.11" }
candle-transformers = "0.11"
cpal = "0.18"
dioxus = { version = "0.7", default-features = false, features = ["desktop", "launch", "lib"], optional = true }
tokenizers = "0.23"
tokio = { version = "1", features = ["rt"], optional = true }
whisper-rs = "0.16"

[target.'cfg(unix)'.dependencies]
rlimit = "0.11"

[profile.dev]
incremental = false

[profile.release]
incremental = false
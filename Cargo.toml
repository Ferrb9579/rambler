[package]
name = "rambler"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rambler"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop", "qwen-blas"]
desktop = ["dep:arboard", "dep:image", "dep:incular", "dep:reqwest", "dep:tokio", "incular/desktop"]
qwen-blas = ["qwen-asr/blas"]

[dependencies]
anyhow = "1"
arboard = { version = "3.6", optional = true }
candle = { package = "candle-core", version = "0.11" }
candle-transformers = "0.11"
cpal = "0.18"
incular = { path = "../incular/crates/incular", optional = true, default-features = false, features = ["controls"] }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
tokenizers = "0.23"
tokio = { version = "1", features = ["rt", "time"], optional = true }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Keep upstream features explicit; `qwen-blas` enables its optimized CPU path.
qwen-asr = { version = "0.11", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"

[profile.dev]
incremental = false

[profile.release]
codegen-units = 1
incremental = false
lto = "thin"
